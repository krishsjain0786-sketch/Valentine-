<!DOCTYPE html>
<html>
<head>
<title>Forever My Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(-45deg, #ff4da6, #ff99cc, #ff66b2, #ffcce6);
  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.card {
  backdrop-filter: blur(15px);
  background: rgba(255, 255, 255, 0.2);
  padding: 50px;
  border-radius: 20px;
  text-align: center;
  color: white;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  position: relative;
}

h1 {
  font-size: 30px;
  margin-bottom: 30px;
}

button {
  padding: 12px 28px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  margin: 10px;
  transition: 0.3s;
}

#yes {
  background: white;
  color: #ff4da6;
  font-weight: bold;
}

#yes:hover {
  transform: scale(1.1);
}

#no {
  background: transparent;
  border: 2px solid white;
  color: white;
  position: absolute;
}

.heart {
  position: absolute;
  font-size: 20px;
  animation: floatUp 6s linear infinite;
  opacity: 0.7;
}

@keyframes floatUp {
  0% {transform: translateY(100vh) scale(0.5);}
  100% {transform: translateY(-10vh) scale(1);}
}
</style>
</head>
<body>

<div class="card">
  <h1>Will you be my forever Valentine? 💖</h1>
  <button id="yes" onclick="yesClicked()">Yes, Always 💘</button>
  <button id="no" onmouseover="moveNo()">Ewww 🤭</button>
</div>

<script>
function yesClicked() {
  document.body.innerHTML = `
  <div style="display:flex;justify-content:center;align-items:center;height:100vh;color:white;text-align:center;flex-direction:column;">
    <h1 style="font-size:40px;">You just made me the happiest person alive ❤️</h1>
    <p style="font-size:20px;">Forever starts now 💍✨</p>
  </div>
  `;
}

function moveNo() {
  var noBtn = document.getElementById("no");
  var x = Math.random() * 300 - 150;
  var y = Math.random() * 200 - 100;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

// Floating hearts generator
setInterval(function() {
  var heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 15) + "px";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}, 500);
</script>

</body>
</html>
